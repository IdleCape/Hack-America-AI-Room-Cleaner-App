<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏡 Cozy Corner — Room Decorating Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e8e0d0; overflow: hidden; height: 100vh; }
  #root { display: flex; height: 100vh; width: 100vw; }
  #sidebar { width: 220px; min-width: 220px; background: #2d1b69; border-right: 2px solid #4a3080; display: flex; flex-direction: column; overflow: hidden; }
  #gameArea { flex: 1; position: relative; overflow: hidden; cursor: crosshair; }
  #gameCanvas { display: block; }
  .panel { padding: 10px; border-bottom: 1px solid #4a3080; }
  .panel h3 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #a890d0; margin-bottom: 8px; }
  .coins { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; color: #ffd700; }
  .coins span { font-size: 13px; }
  .tabs { display: flex; border-bottom: 2px solid #4a3080; }
  .tab { flex: 1; padding: 8px 4px; font-size: 11px; text-align: center; cursor: pointer; color: #a890d0; border: none; background: transparent; letter-spacing: 0.5px; transition: all 0.15s; }
  .tab.active { background: #3d2580; color: #e8d0ff; border-bottom: 2px solid #c890ff; margin-bottom: -2px; }
  .item-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .item-list::-webkit-scrollbar { width: 4px; }
  .item-list::-webkit-scrollbar-thumb { background: #4a3080; border-radius: 2px; }
  .item-card { background: #3d2580; border: 1px solid #5a40a0; border-radius: 8px; padding: 8px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-card:hover { background: #4d3590; border-color: #c890ff; transform: translateX(2px); }
  .item-card.selected { background: #5a3a9e; border-color: #ffd700; box-shadow: 0 0 0 1px #ffd700; }
  .item-card.disabled { opacity: 0.4; cursor: not-allowed; }
  .item-emoji { font-size: 22px; width: 32px; text-align: center; }
  .item-info { flex: 1; }
  .item-name { font-size: 12px; font-weight: 600; color: #e8d0ff; }
  .item-cost { font-size: 11px; color: #ffd700; }
  .item-count { font-size: 10px; color: #a890d0; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 4px; }
  .btn-buy { background: #5a3a9e; color: #e8d0ff; }
  .btn-buy:hover { background: #6a4aae; }
  .btn-place { background: #2d7a4f; color: #a0ffcc; }
  .btn-place:hover { background: #3d8a5f; }
  .status-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(45,27,105,0.9); border: 1px solid #4a3080; border-radius: 20px; padding: 6px 16px; font-size: 12px; color: #c890ff; pointer-events: none; white-space: nowrap; z-index: 10; }
  .toolbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .tool-btn { background: rgba(45,27,105,0.9); border: 1px solid #4a3080; border-radius: 8px; padding: 6px 12px; font-size: 11px; color: #c890ff; cursor: pointer; transition: all 0.15s; }
  .tool-btn:hover { border-color: #c890ff; color: #e8d0ff; }
  .tool-btn.active { background: rgba(90,58,158,0.9); border-color: #ffd700; color: #ffd700; }
  #earnBtn { background: rgba(45,80,40,0.9); border-color: #3d8a5f; color: #a0ffcc; }
  #earnBtn:hover { border-color: #a0ffcc; }
  .help { font-size: 10px; color: #6a5090; text-align: center; padding: 8px; line-height: 1.6; border-top: 1px solid #4a3080; }
</style>
</head>
<body>
<div id="root">
  <div id="sidebar">
    <div class="panel" style="background:#1e0f3d;">
      <div style="font-size:16px;font-weight:700;color:#ffd700;margin-bottom:4px;">🏡 Cozy Corner</div>
      <div class="coins">🪙<span id="coinDisplay">500</span> <span style="color:#a890d0;font-size:11px;">bells</span></div>
    </div>
    <div class="tabs">
      <button class="tab active" id="shopTab" onclick="switchTab('shop')">🛒 Shop</button>
      <button class="tab" id="invTab" onclick="switchTab('inv')">🎒 Bag</button>
    </div>
    <div class="item-list" id="itemList"></div>
    <div class="help">
      WASD / Arrows: Move<br>
      Click room: Place item<br>
      Click placed: Select<br>
      Del / Backspace: Remove<br>
      Escape: Cancel
    </div>
  </div>
  <div id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <div class="status-bar" id="statusBar">Welcome! Buy items from the shop and decorate your room 🌿</div>
    <div class="toolbar">
      <button class="tool-btn active" id="gridBtn" onclick="toggleGrid()">⊞ Grid</button>
      <button class="tool-btn" id="earnBtn" onclick="earnCoins()">✨ Work (+50)</button>
      <button class="tool-btn" onclick="saveRoom()">💾 Save</button>
      <button class="tool-btn" onclick="loadRoom()">📂 Load</button>
    </div>
  </div>
</div>

<script>
const TILE = 40;
const ROOM_W = 18;
const ROOM_H = 13;
const PLAYER_SPEED = 3;

const SHOP_ITEMS = [
  { id:'bed',    name:'Bed',        emoji:'🛏️', cost:80,  w:2, h:2, color:'#8B6B9E' },
  { id:'desk',   name:'Desk',       emoji:'🖥️', cost:60,  w:2, h:1, color:'#6B8B6B' },
  { id:'sofa',   name:'Sofa',       emoji:'🛋️', cost:90,  w:3, h:1, color:'#9E8B6B' },
  { id:'plant',  name:'Plant',      emoji:'🪴', cost:30,  w:1, h:1, color:'#5A8B5A' },
  { id:'lamp',   name:'Lamp',       emoji:'🪔', cost:25,  w:1, h:1, color:'#C4A44A' },
  { id:'tv',     name:'TV',         emoji:'📺', cost:70,  w:2, h:1, color:'#4A6B8B' },
  { id:'shelf',  name:'Bookshelf',  emoji:'📚', cost:45,  w:1, h:2, color:'#8B7A5A' },
  { id:'piano',  name:'Piano',      emoji:'🎹', cost:150, w:2, h:1, color:'#3A3A4A' },
  { id:'rug',    name:'Rug',        emoji:'🪆', cost:40,  w:3, h:2, color:'#9E5A5A' },
  { id:'mirror', name:'Mirror',     emoji:'🪞', cost:35,  w:1, h:2, color:'#8BAABB' },
  { id:'cat',    name:'Cat Bed',    emoji:'🐱', cost:50,  w:1, h:1, color:'#BB8A6A' },
  { id:'flower', name:'Flowers',    emoji:'💐', cost:20,  w:1, h:1, color:'#BB6A9A' },
];

const state = {
  coins: 500,
  inventory: {},
  placed: [],
  player: { x: 5*TILE, y: 5*TILE, dir: 0 },
  keys: {},
  mode: 'move',
  activeItem: null,
  selectedPlaced: null,
  tab: 'shop',
  showGrid: true,
  placingPreview: { tx: 0, ty: 0 },
  animFrame: 0,
  walkAnim: 0,
};

let canvas, ctx, gameDiv;
let offX = 0, offY = 0;

function getItem(id) { return SHOP_ITEMS.find(i => i.id === id); }

function computeOffset() {
  offX = Math.floor((canvas.width  - ROOM_W * TILE) / 2);
  offY = Math.floor((canvas.height - ROOM_H * TILE) / 2);
}

function resize() {
  canvas.width  = gameDiv.clientWidth;
  canvas.height = gameDiv.clientHeight;
  computeOffset();
}

function isBlocked(px, py) {
  const s = 22;
  for (const p of state.placed) {
    const itm = getItem(p.id);
    const fx = p.tx*TILE, fy = p.ty*TILE;
    if (px+s > fx+2 && px-s < fx+itm.w*TILE-2 &&
        py+s > fy+2 && py-s < fy+itm.h*TILE-2) return true;
  }
  return false;
}

function canPlace(tx, ty, itm, skipIdx) {
  if (tx < 0 || ty < 0 || tx+itm.w > ROOM_W || ty+itm.h > ROOM_H) return false;
  for (let i = 0; i < state.placed.length; i++) {
    if (i === skipIdx) continue;
    const p = state.placed[i];
    const pi = getItem(p.id);
    if (tx < p.tx+pi.w && tx+itm.w > p.tx && ty < p.ty+pi.h && ty+itm.h > p.ty) return false;
  }
  return true;
}

function tileFromMouse(mx, my) {
  return { tx: Math.floor((mx-offX)/TILE), ty: Math.floor((my-offY)/TILE) };
}

function update() {
  if (state.mode !== 'move') return;
  let dx = 0, dy = 0;
  if (state.keys['ArrowLeft']  || state.keys['a'] || state.keys['A']) { dx = -PLAYER_SPEED; state.player.dir = 3; }
  if (state.keys['ArrowRight'] || state.keys['d'] || state.keys['D']) { dx =  PLAYER_SPEED; state.player.dir = 1; }
  if (state.keys['ArrowUp']    || state.keys['w'] || state.keys['W']) { dy = -PLAYER_SPEED; state.player.dir = 0; }
  if (state.keys['ArrowDown']  || state.keys['s'] || state.keys['S']) { dy =  PLAYER_SPEED; state.player.dir = 2; }
  if (dx || dy) state.walkAnim++;
  const nx = Math.max(12, Math.min(ROOM_W*TILE-12, state.player.x+dx));
  const ny = Math.max(12, Math.min(ROOM_H*TILE-12, state.player.y+dy));
  if (dx && !isBlocked(nx, state.player.y)) state.player.x = nx;
  if (dy && !isBlocked(state.player.x, ny)) state.player.y = ny;
}

function drawRoom() {
  const W = canvas.width, H = canvas.height;
  const rw = ROOM_W*TILE, rh = ROOM_H*TILE;
  ctx.clearRect(0, 0, W, H);

  // outer bg
  ctx.fillStyle = '#1a0f35';
  ctx.fillRect(0, 0, W, H);

  // wall
  ctx.fillStyle = '#f5e6c8';
  ctx.fillRect(offX, offY, rw, 60);

  // floor tiles
  for (let x = 0; x < ROOM_W; x++) {
    for (let y = 2; y < ROOM_H; y++) {
      ctx.fillStyle = (x+y)%2===0 ? '#d4b87a' : '#c8a860';
      ctx.fillRect(offX+x*TILE+1, offY+y*TILE+1, TILE-1, TILE-1);
    }
  }

  // baseboard
  ctx.fillStyle = '#b89650';
  ctx.fillRect(offX, offY+TILE*2-4, rw, 5);

  // grid
  if (state.showGrid) {
    ctx.strokeStyle = 'rgba(0,0,0,0.09)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= ROOM_W; x++) {
      ctx.beginPath(); ctx.moveTo(offX+x*TILE, offY); ctx.lineTo(offX+x*TILE, offY+rh); ctx.stroke();
    }
    for (let y = 0; y <= ROOM_H; y++) {
      ctx.beginPath(); ctx.moveTo(offX, offY+y*TILE); ctx.lineTo(offX+rw, offY+y*TILE); ctx.stroke();
    }
  }

  // room border
  ctx.strokeStyle = '#8B6B3A';
  ctx.lineWidth = 3;
  ctx.strokeRect(offX, offY, rw, rh);

  // window
  ctx.fillStyle = '#a8d4f0';
  ctx.fillRect(offX+5*TILE, offY+6, TILE*2, TILE-10);
  ctx.strokeStyle = '#6B8B5A';
  ctx.lineWidth = 2;
  ctx.strokeRect(offX+5*TILE, offY+6, TILE*2, TILE-10);
  ctx.beginPath(); ctx.moveTo(offX+6*TILE, offY+6); ctx.lineTo(offX+6*TILE, offY+TILE-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(offX+5*TILE, offY+TILE/2); ctx.lineTo(offX+7*TILE, offY+TILE/2); ctx.stroke();

  // curtains
  ctx.fillStyle = 'rgba(200,100,120,0.5)';
  ctx.fillRect(offX+5*TILE-8, offY+2, 10, TILE);
  ctx.fillRect(offX+7*TILE-2, offY+2, 10, TILE);

  // door
  ctx.fillStyle = '#8B5A3A';
  ctx.fillRect(offX+13*TILE, offY+rh-TILE-2, TILE*1.5, TILE+2);
  ctx.strokeStyle = '#5A3A1A';
  ctx.lineWidth = 2;
  ctx.strokeRect(offX+13*TILE, offY+rh-TILE-2, TILE*1.5, TILE+2);
  ctx.fillStyle = '#d4a060';
  ctx.beginPath(); ctx.arc(offX+14.2*TILE, offY+rh-TILE/2, 4, 0, Math.PI*2); ctx.fill();
}

function drawFurniture() {
  const previewItem = (state.mode === 'place' && state.activeItem) ? getItem(state.activeItem) : null;
  const { tx: ptx, ty: pty } = state.placingPreview;

  for (let i = 0; i < state.placed.length; i++) {
    const p = state.placed[i];
    const itm = getItem(p.id);
    const fx = offX+p.tx*TILE, fy = offY+p.ty*TILE;
    const fw = itm.w*TILE, fh = itm.h*TILE;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(fx+3, fy+4, fw, fh);

    // body
    ctx.fillStyle = itm.color;
    roundRect(fx, fy, fw, fh, 6);
    ctx.fill();

    // selection
    if (state.selectedPlaced === i) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2.5;
      roundRect(fx-1, fy-1, fw+2, fh+2, 7);
      ctx.stroke();
    }

    // emoji
    ctx.font = `${Math.min(itm.w, itm.h)*20}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'white'; // needed after fillStyle change
    ctx.fillText(itm.emoji, fx+fw/2, fy+fh/2);
  }

  // placement preview
  if (previewItem) {
    const ok = canPlace(ptx, pty, previewItem, -1);
    const fx = offX+ptx*TILE, fy = offY+pty*TILE;
    const fw = previewItem.w*TILE, fh = previewItem.h*TILE;
    ctx.fillStyle = ok ? 'rgba(80,200,120,0.35)' : 'rgba(200,80,80,0.35)';
    roundRect(fx, fy, fw, fh, 6); ctx.fill();
    ctx.strokeStyle = ok ? '#50c878' : '#c85050';
    ctx.lineWidth = 2;
    roundRect(fx, fy, fw, fh, 6); ctx.stroke();
    ctx.font = `${Math.min(previewItem.w, previewItem.h)*20}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.7;
    ctx.fillText(previewItem.emoji, fx+fw/2, fy+fh/2);
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  const px = offX + state.player.x;
  const py = offY + state.player.y;
  const walk = Math.sin(state.walkAnim * 0.3) * 2;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(px, py+14, 10, 4, 0, 0, Math.PI*2); ctx.fill();

  // body
  ctx.fillStyle = '#ff9eb5';
  roundRect(px-10, py-18+walk, 20, 24, 8); ctx.fill();

  // head
  ctx.fillStyle = '#ffd0a0';
  ctx.beginPath(); ctx.arc(px, py-22+walk, 12, 0, Math.PI*2); ctx.fill();

  // hair
  ctx.fillStyle = '#6a3a1a';
  ctx.beginPath(); ctx.ellipse(px, py-31+walk, 11, 7, 0, Math.PI, Math.PI*2); ctx.fill();

  // eyes (only when facing forward or sideways)
  if (state.player.dir !== 0) {
    const eo = state.player.dir === 3 ? -3 : state.player.dir === 1 ? 3 : 0;
    ctx.fillStyle = '#4a2a1a';
    ctx.beginPath(); ctx.arc(px+eo-3, py-23+walk, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px+eo+3, py-23+walk, 2, 0, Math.PI*2); ctx.fill();
  }

  // legs
  const ls = Math.sin(state.walkAnim * 0.3) * 5;
  ctx.fillStyle = '#6a5a9a';
  ctx.fillRect(px-8, py+5+walk, 7, 10+ls);
  ctx.fillRect(px+1,  py+5+walk, 7, 10-ls);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function render() {
  state.animFrame++;
  update();
  drawRoom();
  drawFurniture();
  drawPlayer();
  requestAnimationFrame(render);
}

// ── UI ──────────────────────────────────────────────────────────────────────

function switchTab(t) {
  state.tab = t;
  document.getElementById('shopTab').classList.toggle('active', t === 'shop');
  document.getElementById('invTab').classList.toggle('active', t === 'inv');
  renderUI();
}

function renderUI() {
  document.getElementById('coinDisplay').textContent = state.coins;
  const list = document.getElementById('itemList');
  list.innerHTML = '';

  if (state.tab === 'shop') {
    SHOP_ITEMS.forEach(itm => {
      const canAfford = state.coins >= itm.cost;
      const card = document.createElement('div');
      card.className = 'item-card' + (canAfford ? '' : ' disabled');
      card.innerHTML = `
        <div class="item-emoji">${itm.emoji}</div>
        <div class="item-info">
          <div class="item-name">${itm.name}</div>
          <div class="item-cost">🪙 ${itm.cost}</div>
        </div>
      `;
      if (canAfford) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-buy';
        btn.textContent = 'Buy';
        btn.onclick = e => { e.stopPropagation(); buyItem(itm.id); };
        card.appendChild(btn);
      }
      list.appendChild(card);
    });
  } else {
    const entries = Object.entries(state.inventory).filter(([,v]) => v > 0);
    if (!entries.length) {
      list.innerHTML = '<div style="color:#6a5090;font-size:12px;text-align:center;padding:20px;">Your bag is empty!<br>Buy items from the shop.</div>';
    } else {
      entries.forEach(([id, count]) => {
        const itm = getItem(id);
        const isActive = state.activeItem === id && state.mode === 'place';
        const card = document.createElement('div');
        card.className = 'item-card' + (isActive ? ' selected' : '');
        card.innerHTML = `
          <div class="item-emoji">${itm.emoji}</div>
          <div class="item-info">
            <div class="item-name">${itm.name}</div>
            <div class="item-count">x${count}</div>
          </div>
        `;
        const btn = document.createElement('button');
        btn.className = 'btn btn-place';
        btn.textContent = isActive ? '✓ Placing…' : 'Place';
        btn.onclick = e => { e.stopPropagation(); startPlace(id); };
        card.appendChild(btn);
        list.appendChild(card);
      });
    }
  }
}

function buyItem(id) {
  const itm = getItem(id);
  if (state.coins < itm.cost) return;
  state.coins -= itm.cost;
  state.inventory[id] = (state.inventory[id] || 0) + 1;
  setStatus(`Bought ${itm.name}! Go to your bag to place it.`);
  renderUI();
}

function startPlace(id) {
  if (state.activeItem === id && state.mode === 'place') {
    state.mode = 'move'; state.activeItem = null;
  } else {
    state.mode = 'place'; state.activeItem = id; state.selectedPlaced = null;
    setStatus(`Click the room to place ${getItem(id).name}. Click bag item again to cancel.`);
  }
  renderUI();
}

function removePlaced(idx) {
  const p = state.placed[idx];
  state.inventory[p.id] = (state.inventory[p.id] || 0) + 1;
  state.placed.splice(idx, 1);
  state.selectedPlaced = null;
  setStatus(`Returned ${getItem(p.id).name} to bag.`);
  renderUI();
}

function earnCoins() {
  state.coins += 50;
  setStatus('You worked hard and earned 50 bells! 🌟');
  renderUI();
  const btn = document.getElementById('earnBtn');
  btn.style.color = '#ffd700';
  setTimeout(() => { btn.style.color = '#a0ffcc'; }, 600);
}

function toggleGrid() {
  state.showGrid = !state.showGrid;
  document.getElementById('gridBtn').classList.toggle('active', state.showGrid);
}

function saveRoom() {
  localStorage.setItem('cozyRoom', JSON.stringify({
    placed: state.placed, inventory: state.inventory, coins: state.coins
  }));
  setStatus('Room saved! 💾');
}

function loadRoom() {
  const raw = localStorage.getItem('cozyRoom');
  if (!raw) { setStatus('No saved room found.'); return; }
  const data = JSON.parse(raw);
  state.placed    = data.placed    || [];
  state.inventory = data.inventory || {};
  state.coins     = data.coins     || 500;
  setStatus('Room loaded! 📂');
  renderUI();
}

let statusTimer;
function setStatus(msg) {
  document.getElementById('statusBar').textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => {
    document.getElementById('statusBar').textContent = 'Move with WASD • Buy in Shop • Place from Bag';
  }, 3000);
}

// ── Boot ─────────────────────────────────────────────────────────────────────

canvas  = document.getElementById('gameCanvas');
ctx     = canvas.getContext('2d');
gameDiv = document.getElementById('gameArea');

resize();
window.addEventListener('resize', resize);
renderUI();
render();

try { loadRoom(); } catch(e) {}

// ── Input ────────────────────────────────────────────────────────────────────

window.addEventListener('keydown', e => {
  state.keys[e.key] = true;
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedPlaced !== null) {
    e.preventDefault();
    removePlaced(state.selectedPlaced);
  }
  if (e.key === 'Escape') {
    state.mode = 'move'; state.activeItem = null; state.selectedPlaced = null;
    renderUI();
  }
});
window.addEventListener('keyup', e => { state.keys[e.key] = false; });

gameDiv.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  state.placingPreview = tileFromMouse(mx, my);
});

gameDiv.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const { tx, ty } = tileFromMouse(mx, my);

  if (state.mode === 'place' && state.activeItem) {
    const itm = getItem(state.activeItem);
    if (canPlace(tx, ty, itm, -1)) {
      state.placed.push({ id: state.activeItem, tx, ty });
      state.inventory[state.activeItem]--;
      if (!state.inventory[state.activeItem]) {
        state.mode = 'move'; state.activeItem = null;
      }
      setStatus(`Placed ${itm.name}! Click it to select & remove.`);
      renderUI();
    } else {
      setStatus('Cannot place there — space is occupied or out of bounds.');
    }
    return;
  }

  // Select placed furniture
  let found = -1;
  for (let i = state.placed.length-1; i >= 0; i--) {
    const p = state.placed[i];
    const itm = getItem(p.id);
    const fx = offX+p.tx*TILE, fy = offY+p.ty*TILE;
    if (mx >= fx && mx <= fx+itm.w*TILE && my >= fy && my <= fy+itm.h*TILE) { found = i; break; }
  }
  state.selectedPlaced = (found >= 0 && state.selectedPlaced !== found) ? found : null;
  if (found >= 0 && state.selectedPlaced === found) {
    setStatus(`Selected ${getItem(state.placed[found].id).name}. Press Delete/Backspace to remove.`);
  }
  renderUI();
});

</script>
</body>
</html>
