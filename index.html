<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MessQuest AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ── Navigation bar ── -->
<div id="nav">
  <div class="app-title">🏡 MessQuest AI</div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-cleaner" onclick="switchScreen('cleaner')">🧹 Clean</button>
    <button class="nav-tab"        id="tab-game"    onclick="switchScreen('game')">🪑 Decorate</button>
  </div>
  <div class="bells-display" id="globalBells">
    🪙 <span id="coinDisplay">0</span>
    <span class="bells-label">bells</span>
  </div>
</div>

<!-- ── Cleaner screen ── -->
<div id="screen-cleaner" class="visible">
  <div id="cleaner-root"></div>
</div>

<!-- ── Decorate / game screen ── -->
<div id="screen-game">
  <div id="sidebar">
    <div class="tabs">
      <button class="tab active" id="shopTab" onclick="switchTab('shop')">🛒 Shop</button>
      <button class="tab"        id="invTab"  onclick="switchTab('inv')">🎒 Bag</button>
    </div>
    <div class="item-list" id="itemList"></div>
    <div class="clean-hint">
      <strong>💡 Earn bells by cleaning!</strong><br>
      Each step you tick off in the 🧹 Clean tab earns +50 bells to spend here.
    </div>
    <div class="help">
      WASD / Arrows: Move<br>
      Click room: Place item<br>
      Click placed: Select<br>
      Del / Backspace: Remove<br>
      Escape: Cancel
    </div>
  </div>
  <div id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <div class="status-bar" id="statusBar">Buy items from the shop and decorate your room 🌿</div>
    <div class="toolbar">
      <button class="tool-btn active" id="gridBtn" onclick="toggleGrid()">⊞ Grid</button>
      <button class="tool-btn"                     onclick="saveRoom()">💾 Save</button>
      <button class="tool-btn"                     onclick="loadRoom()">📂 Load</button>
    </div>
  </div>
</div>

<!-- ── Scripts ── -->
<!-- Load order matters: shared → React → cleaner → shop → room → furniture → player → game -->

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="js/shared.js"></script>    <!-- SharedBells bridge + switchScreen -->
<script src="js/cleaner.js"></script>   <!-- React room-cleaner component -->
<script src="js/shop.js"></script>      <!-- SHOP_ITEMS, renderGameUI, buyItem, startPlace, removePlaced -->
<script src="js/room.js"></script>      <!-- drawRoom, toggleGrid, saveRoom, loadRoom, setGameStatus -->
<script src="js/furniture.js"></script> <!-- drawFurniture, roundRect, isBlocked, canPlace, tileFromMouse -->
<script src="js/player.js"></script>    <!-- update, drawPlayer -->
<script src="js/game.js"></script>      <!-- gameState, render loop, input handlers, boot -->

</body>
</html>
