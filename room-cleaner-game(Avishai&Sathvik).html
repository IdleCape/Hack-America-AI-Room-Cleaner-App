<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MessQuest AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef7f1; min-height: 100vh; overflow: hidden; }

  /* ── NAV BAR ── */
  #nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    /* Changed to grid to ensure perfect centering of tabs */
    display: grid;
    grid-template-columns: 1fr auto 1fr; 
    align-items: center;
    background: #dcf0e2; border-bottom: 2px solid #aed6bc;
    padding: 0 16px; height: 52px;
  }
  
  #nav .app-title { 
    justify-self: start;
    font-size: 15px; font-weight: 700; color: #c28b00; 
  }
  
  #nav .nav-tabs { 
    justify-self: center;
    display: flex; gap: 4px; 
  }
  
  #nav .nav-tab {
    padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; background: transparent; color: #4a7a5d;
    transition: all 0.2s;
  }
  #nav .nav-tab.active { background: #c6e6d1; color: #113d23; }
  #nav .nav-tab:hover:not(.active) { color: #113d23; }
  
  /* The Bells Display - Right aligned within its grid column */
  #nav .bells-display {
    justify-self: end;
    display: none; 
    align-items: center; gap: 6px;
    font-size: 14px; font-weight: 700; color: #c28b00;
  }
  #nav .bells-display .bells-label { font-size: 11px; color: #4a7a5d; font-weight: 400; }

  /* earned bell flash */
  .bells-earned-toast {
    position: fixed; top: 60px; right: 16px; z-index: 200;
    background: #e6f2eb; border: 1.5px solid #aed6bc; border-radius: 20px;
    padding: 8px 16px; color: #113d23; font-size: 13px; font-weight: 600;
    pointer-events: none;
    animation: toastIn 0.3s ease, toastOut 0.4s ease 2s forwards;
  }
  @keyframes toastIn { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity:0; transform: translateY(-8px); } }

  /* ── SCREEN CONTAINERS ── */
  #screen-cleaner, #screen-game {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
    display: none;
    overflow-y: auto;
  }
  #screen-cleaner.visible { display: block; }
  #screen-game.visible { display: flex; }

  /* ── CLEANER STYLES ── */
  #screen-cleaner {
    background: #f4f9f5;
  }
  #cleaner-root {
    width: 100%; max-width: 480px; margin: 0 auto; padding: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .drop-zone {
    border: 2px dashed #ccc; border-radius: 12px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    background: #fff; margin-bottom: 16px;
  }
  .drop-zone.dragover { border-color: #3b8c56; background: #e8f5ed; }
  .drop-zone input { display: none; }
  .btn-primary { width:100%; padding:14px; font-size:15px; font-weight:600; border-radius:12px; background:#3b8c56; color:#fff; border:none; cursor:pointer; }
  .btn-secondary { width:100%; padding:12px; font-size:14px; border-radius:12px; background:transparent; color:#113d23; border:0.5px solid rgba(0,0,0,0.2); cursor:pointer; }
  .back-btn { background:none; border:none; cursor:pointer; font-size:20px; color:#888; padding:0; line-height:1; }
  .error-box { margin-bottom:12px; padding:10px 14px; background:#FCEBEB; border:0.5px solid #F09595; border-radius:8px; font-size:13px; color:#791F1F; }

  /* ── GAME STYLES ── */
  #screen-game { background: #eef7f1; }
  #sidebar {
    width: 220px; min-width: 220px; background: #dcf0e2;
    border-right: 2px solid #aed6bc; display: flex; flex-direction: column; overflow: hidden;
  }
  #gameArea { flex: 1; position: relative; overflow: hidden; cursor: crosshair; }
  #gameCanvas { display: block; }
  .panel { padding: 10px; border-bottom: 1px solid #aed6bc; }
  .panel h3 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #4a7a5d; margin-bottom: 8px; }
  .coins { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; color: #c28b00; }
  .coins span { font-size: 13px; }
  .tabs { display: flex; border-bottom: 2px solid #aed6bc; }
  .tab { flex: 1; padding: 8px 4px; font-size: 11px; text-align: center; cursor: pointer; color: #4a7a5d; border: none; background: transparent; letter-spacing: 0.5px; transition: all 0.15s; }
  .tab.active { background: #c6e6d1; color: #113d23; border-bottom: 2px solid #3b8c56; margin-bottom: -2px; }
  .item-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .item-list::-webkit-scrollbar { width: 4px; }
  .item-list::-webkit-scrollbar-thumb { background: #aed6bc; border-radius: 2px; }
  .item-card { background: #e8f5ed; border: 1px solid #aed6bc; border-radius: 8px; padding: 8px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-card:hover { background: #c6e6d1; border-color: #3b8c56; transform: translateX(2px); }
  .item-card.selected { background: #b3dabb; border-color: #c28b00; box-shadow: 0 0 0 1px #c28b00; }
  .item-card.disabled { opacity: 0.4; cursor: not-allowed; }
  .item-emoji { font-size: 22px; width: 32px; text-align: center; }
  .item-info { flex: 1; }
  .item-name { font-size: 12px; font-weight: 600; color: #113d23; }
  .item-cost { font-size: 11px; color: #c28b00; }
  .item-count { font-size: 10px; color: #4a7a5d; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 4px; }
  .btn-buy { background: #3b8c56; color: #fff; }
  .btn-buy:hover { background: #2c7042; }
  .btn-place { background: #3b8c56; color: #fff; }
  .btn-place:hover { background: #2c7042; }
  .status-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(232,245,237,0.9); border: 1px solid #aed6bc; border-radius: 20px; padding: 6px 16px; font-size: 12px; color: #113d23; pointer-events: none; white-space: nowrap; z-index: 10; }
  .toolbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .tool-btn { background: rgba(232,245,237,0.9); border: 1px solid #aed6bc; border-radius: 8px; padding: 6px 12px; font-size: 11px; color: #4a7a5d; cursor: pointer; transition: all 0.15s; }
  .tool-btn:hover { border-color: #3b8c56; color: #113d23; }
  .tool-btn.active { background: rgba(198,230,209,0.9); border-color: #c28b00; color: #c28b00; }
  .help { font-size: 10px; color: #648f74; text-align: center; padding: 8px; line-height: 1.6; border-top: 1px solid #aed6bc; }

  .clean-hint {
    padding: 8px 10px; font-size: 10px; color: #648f74; text-align: center;
    border-top: 1px solid #aed6bc; line-height: 1.5;
  }
  .clean-hint strong { color: #4a7a5d; }
</style>
</head>
<body>

<div id="nav">
  <div class="app-title">🏡 MessQuest AI</div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-cleaner" onclick="switchScreen('cleaner')">🧹 Clean</button>
    <button class="nav-tab" id="tab-game" onclick="switchScreen('game')">🪑 Decorate</button>
  </div>
  <div class="bells-display" id="globalBells">

    <span class="bells-label">bells</span>

</div>

<div id="screen-cleaner" class="visible">
  <div id="cleaner-root"></div>
</div>

<div id="screen-game">
  <div id="sidebar">
    <div class="panel" style="background:#c6e6d1;">
      <div style="font-size:14px;font-weight:700;color:#c28b00;margin-bottom:4px;">🏡 Cozy Corner</div>

      WASD / Arrows: Move<br>

    <div class="toolbar">
      <button class="tool-btn active" id="gridBtn" onclick="toggleGrid()">⊞ Grid</button>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
const SharedBells = {
  _bells: 0,
  _listeners: [],
  get() { return this._bells; },
  add(n) {
    this._bells += n;
    this._listeners.forEach(fn => fn(this._bells));
    document.getElementById('navBells').textContent = this._bells;
    if (typeof gameState !== 'undefined') {
      gameState.coins = this._bells;
      if (typeof renderGameUI === 'function') renderGameUI();
    }
    showBellsToast('+' + n + ' 🪙 bells earned!');
  },
  set(n) {
    this._bells = n;
    this._listeners.forEach(fn => fn(this._bells));
    document.getElementById('navBells').textContent = this._bells;
  },
  syncFromGame() {
    if (typeof gameState !== 'undefined') {
      this._bells = gameState.coins;
      document.getElementById('navBells').textContent = this._bells;
    }
  },
  onUpdate(fn) { this._listeners.push(fn); }
};

function showBellsToast(msg) {
  const el = document.createElement('div');
  el.className = 'bells-earned-toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function switchScreen(name) {
  document.getElementById('screen-cleaner').classList.toggle('visible', name === 'cleaner');
  document.getElementById('screen-game').classList.toggle('visible', name === 'game');
  document.getElementById('tab-cleaner').classList.toggle('active', name === 'cleaner');
  document.getElementById('tab-game').classList.toggle('active', name === 'game');

  const globalBells = document.getElementById('globalBells');
  if (globalBells) {
    globalBells.style.display = name === 'game' ? 'flex' : 'none';
  }

  if (name === 'game') {
    if (typeof gameState !== 'undefined') {
      gameState.coins = SharedBells.get();
      if (typeof renderGameUI === 'function') renderGameUI();
    }
    setTimeout(() => { if (typeof resize === 'function') resize(); }, 50);
  }
}

const { useState, useRef, useEffect, useCallback } = React;
const API_KEY = "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";

const CLUTTER_CATEGORIES = [
  { id: "laundry",   label: "Laundry",        bg: "#B5D4F4", color: "#0C447C" },
  { id: "trash",     label: "Trash",           bg: "#F5C4B3", color: "#712B13" },
  { id: "surfaces",  label: "Dirty surfaces",  bg: "#FAC775", color: "#633806" },
  { id: "misplaced", label: "Misplaced items", bg: "#9FE1CB", color: "#085041" },
  { id: "bed",       label: "Unmade bed",      bg: "#CECBF6", color: "#3C3489" },
  { id: "dishes",    label: "Dishes",          bg: "#F4C0D1", color: "#72243E" },
];

const SYSTEM_PROMPT = `You are a room cleaning assistant. You will receive one or more images. Analyze all images together then respond ONLY with a JSON object:
{
  "categories": ["list of detected clutter types from: laundry, trash, surfaces, misplaced, bed, dishes"],
  "steps": [
    "Step 1: specific actionable instruction",
    "Step 2: specific actionable instruction",
    "Step 3: specific actionable instruction",
    "Step 4: specific actionable instruction",
    "Step 5: specific actionable instruction"
  ],
  "summary": "One sentence describing the overall state of the room"
}
Always return exactly 5 steps.`;

function resizeImageToBase64(dataUrl, maxSize = 768) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.src = dataUrl;
  });
}

function extractFramesFromVideo(file, numFrames = 6) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const video = document.createElement("video");
    video.src = url; video.muted = true; video.playsInline = true;
    video.onloadedmetadata = () => {
      const duration = video.duration;
      const times = [];
      for (let i = 0; i < numFrames; i++) times.push((duration / (numFrames + 1)) * (i + 1));
      const frames = []; let idx = 0;
      const captureNext = () => {
        if (idx >= times.length) { URL.revokeObjectURL(url); resolve(frames); return; }
        video.currentTime = times[idx];
      };
      video.onseeked = () => {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        frames.push(canvas.toDataURL("image/jpeg", 0.8)); idx++; captureNext();
      };
      video.onerror = () => reject(new Error("Could not load video"));
      captureNext();
    };
    video.onerror = () => reject(new Error("Could not load video file"));
    video.load();
  });
}

function RoomCleaner() {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const fileInputRef = useRef(null);

  const [screen, setScreen] = useState("home");
  const [capturedImage, setCapturedImage] = useState(null);
  const [analysis, setAnalysis] = useState(null);
  const [completedSteps, setCompletedSteps] = useState(new Set());
  const [error, setError] = useState(null);
  const [cameraReady, setCameraReady] = useState(false);
  const [streak, setStreak] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [mode, setMode] = useState(null);
  const [scanningMsg, setScanningMsg] = useState("Analyzing your room...");
  const [videoFrames, setVideoFrames] = useState([]);
  const [currentFrame, setCurrentFrame] = useState(0);

  const startCamera = useCallback(async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.onloadedmetadata = () => setCameraReady(true); }
    } catch (err) { setError("Camera access denied."); }
  }, []);

  const stopCamera = useCallback(() => {
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; setCameraReady(false); }
  }, []);

  useEffect(() => { if (mode === "camera") startCamera(); return () => stopCamera(); }, [mode]);

  const analyzeImages = async (frames, previewUrl) => {
    setCapturedImage(previewUrl); stopCamera(); setScreen("scanning"); setError(null);
    try {
      setScanningMsg("Resizing frames...");
      const resized = await Promise.all(frames.map(f => resizeImageToBase64(f)));
      setScanningMsg("Analyzing your room...");
      const imageContent = resized.map(b64 => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } }));
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-api-key": API_KEY, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: "claude-haiku-4-5-20251001", max_tokens: 500, system: SYSTEM_PROMPT, messages: [{ role: "user", content: [...imageContent, { type: "text", text: "Analyze and provide cleaning instructions." }] }] })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.map(b => b.text || "").join("") || "";
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      setAnalysis(parsed); setCompletedSteps(new Set()); setScreen("results");
    } catch (err) {
      setError("Analysis failed: " + err.message);
      setScreen(mode === "camera" ? "camera" : "upload");
      if (mode === "camera") startCamera();
    }
  };

  const captureFromCamera = () => {
    if (!videoRef.current || !canvasRef.current) return;
    const video = videoRef.current; const canvas = canvasRef.current;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
    analyzeImages([dataUrl], dataUrl);
  };

  const handleFile = async (file) => {
    setError(null);
    const isVideo = file.type.startsWith("video/");
    const isImage = file.type.startsWith("image/");
    if (!isVideo && !isImage) return;
    if (isVideo) {
      setScreen("scanning"); setScanningMsg("Extracting frames...");
      try {
        const frames = await extractFramesFromVideo(file, 6);
        setVideoFrames(frames); setCurrentFrame(0);
        await analyzeImages(frames, frames[0]);
      } catch (err) { setError("Video error: " + err.message); setScreen("upload"); }
      return;
    }
    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = e.target.result;
      await analyzeImages([dataUrl], dataUrl);
    };
    reader.readAsDataURL(file);
  };

  const toggleStep = (index) => {
    setCompletedSteps(prev => {
      const next = new Set(prev);
      if (next.has(index)) {
        next.delete(index);
        SharedBells.set(Math.max(0, SharedBells.get() - 50));
      } else {
        next.add(index);
        SharedBells.add(50);
        if (next.size === 5) setStreak(s => s + 1);
      }
      return next;
    });
  };

  const goHome = () => {
    stopCamera(); setCapturedImage(null); setAnalysis(null);
    setCompletedSteps(new Set()); setError(null); setMode(null);
    setVideoFrames([]); setCurrentFrame(0); setScreen("home");
  };

  const progress = analysis ? Math.round((completedSteps.size / 5) * 100) : 0;
  const detectedCategories = analysis ? CLUTTER_CATEGORIES.filter(c => analysis.categories.includes(c.id)) : [];

  if (screen === "home") return React.createElement("div", { style:{ paddingTop:8 } },
    React.createElement("div", { style:{ marginBottom:24 } },
      React.createElement("h2", { style:{ fontSize:20, fontWeight:600, color:"#1a1a1a" } }, "Room Cleaner"),
      React.createElement("p", { style:{ fontSize:13, color:"#888", marginTop:4 } }, "Scan your room to earn bells to spend in Decorate!")
    ),
    React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:12 } },
      React.createElement("button", { onClick:()=>{ setMode("camera"); setScreen("camera"); }, className:"btn-primary" }, "Use camera"),
      React.createElement("button", { onClick:()=>{ setMode("upload"); setScreen("upload"); }, className:"btn-secondary", style:{background:"#fff"} }, "Upload photo or video")
    )
  );

  if (screen === "upload") return React.createElement("div", null,
    React.createElement("button", { onClick:goHome, className:"back-btn" }, "← Back"),
    React.createElement("div", {
      className: "drop-zone" + (dragging ? " dragover" : ""),
      onClick: ()=> fileInputRef.current && fileInputRef.current.click(),
      onDragOver: (e)=>{ e.preventDefault(); setDragging(true); },
      onDragLeave: ()=> setDragging(false),
      onDrop: (e)=>{ e.preventDefault(); setDragging(false); const f=e.dataTransfer.files[0]; if(f) handleFile(f); }
    },
      React.createElement("input", { ref:fileInputRef, type:"file", accept:"image/*,video/*", onChange:(e)=>{ if(e.target.files[0]) handleFile(e.target.files[0]); } }),
      React.createElement("p", null, dragging ? "Drop here" : "Click to browse or drag file here")
    ),
    error && React.createElement("div", { className:"error-box" }, error)
  );

  if (screen === "camera") return React.createElement("div", null,
    React.createElement("button", { onClick:goHome, className:"back-btn" }, "← Back"),
    React.createElement("div", { style:{ position:"relative", borderRadius:12, overflow:"hidden", aspectRatio:"4/3", background:"#000", marginBottom:16 } },
      React.createElement("video", { ref:videoRef, autoPlay:true, playsInline:true, muted:true, style:{ width:"100%", height:"100%", objectFit:"cover" } })
    ),
    React.createElement("canvas", { ref:canvasRef, style:{ display:"none" } }),
    React.createElement("button", { onClick:captureFromCamera, disabled:!cameraReady, className:"btn-primary" }, "Scan room")
  );

  if (screen === "scanning") return React.createElement("div", { style:{ textAlign:"center", padding:"40px 0" } },
    React.createElement("div", { className:"spin", style:{ width:32, height:32, border:"2px solid #3b8c56", borderTopColor:"transparent", borderRadius:"50%", margin:"0 auto", animation:"spin 1s linear infinite" } }),
    React.createElement("p", { style:{ marginTop:16 } }, scanningMsg)
  );

  if (screen === "results" && analysis) return React.createElement("div", null,
    React.createElement("div", { style:{ marginBottom:16 } },
      React.createElement("h2", null, "Cleaning plan"),
      React.createElement("p", { style:{ color:"#888" } }, analysis.summary)
    ),
    React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:8, marginBottom:20 } },
      analysis.steps.map((step, i) => {
        const done = completedSteps.has(i);
        return React.createElement("div", { key:i, onClick:()=>toggleStep(i), style:{ display:"flex", alignItems:"center", gap:12, padding:14, background: done?"#EAF3DE":"#fff", borderRadius:10, cursor:"pointer", border:"1px solid #eee" } },
          React.createElement("div", { style:{ width:20, height:20, borderRadius:"50%", border:"2px solid "+(done?"#3b8c56":"#ccc"), background:done?"#3b8c56":"transparent" } }),
          React.createElement("span", { style:{ textDecoration: done?"line-through":"none" } }, step)
        );
      })
    ),
    React.createElement("button", { onClick:goHome, className:"btn-secondary" }, "Home")
  );

  return null;
}

const cleanerRoot = ReactDOM.createRoot(document.getElementById("cleaner-root"));
cleanerRoot.render(React.createElement(RoomCleaner));
</script>

<script>
const TILE = 40;
const ROOM_W = 18;
const ROOM_H = 13;
const PLAYER_SPEED = 3;

const SHOP_ITEMS = [
  { id:'bed',    name:'Bed',        emoji:'🛏️', cost:80,  w:2, h:2, color:'#8B6B9E' },
  { id:'desk',   name:'Desk',       emoji:'🖥️', cost:60,  w:2, h:1, color:'#6B8B6B' },
  { id:'sofa',   name:'Sofa',       emoji:'🛋️', cost:90,  w:3, h:1, color:'#9E8B6B' },
  { id:'plant',  name:'Plant',      emoji:'🪴', cost:30,  w:1, h:1, color:'#5A8B5A' },
  { id:'lamp',   name:'Lamp',       emoji:'🪔', cost:25,  w:1, h:1, color:'#C4A44A' },
  { id:'tv',     name:'TV',         emoji:'📺', cost:70,  w:2, h:1, color:'#4A6B8B' },
];

const gameState = {
  coins: 0, 
  inventory: {},
  placed: [],
  player: { x: 5*TILE, y: 5*TILE, dir: 0 },
  keys: {},
  mode: 'move',
  activeItem: null,
  selectedPlaced: null,
  tab: 'shop',
  showGrid: true,
  placingPreview: { tx: 0, ty: 0 },
  animFrame: 0,
  walkAnim: 0,
};

let canvas, ctx, gameDiv;
let offX = 0, offY = 0;

function getItem(id) { return SHOP_ITEMS.find(i => i.id === id); }
function computeOffset() { offX = Math.floor((canvas.width - ROOM_W*TILE)/2); offY = Math.floor((canvas.height - ROOM_H*TILE)/2); }
function resize() { canvas.width = gameDiv.clientWidth; canvas.height = gameDiv.clientHeight; computeOffset(); }

function isBlocked(px, py) {
  const s = 22;
  for (const p of gameState.placed) {
    const itm = getItem(p.id);
    const fx = p.tx*TILE, fy = p.ty*TILE;
    if (px+s > fx+2 && px-s < fx+itm.w*TILE-2 && py+s > fy+2 && py-s < fy+itm.h*TILE-2) return true;
  }
  return false;
}

function canPlace(tx, ty, itm, skipIdx) {
  if (tx < 0 || ty < 0 || tx+itm.w > ROOM_W || ty+itm.h > ROOM_H) return false;
  for (let i = 0; i < gameState.placed.length; i++) {
    if (i === skipIdx) continue;
    const p = gameState.placed[i]; const pi = getItem(p.id);
    if (tx < p.tx+pi.w && tx+itm.w > p.tx && ty < p.ty+pi.h && ty+itm.h > p.ty) return false;
  }
  return true;
}

function tileFromMouse(mx, my) { return { tx: Math.floor((mx-offX)/TILE), ty: Math.floor((my-offY)/TILE) }; }

function update() {
  if (gameState.mode !== 'move') return;
  let dx = 0, dy = 0;
  if (gameState.keys['ArrowLeft']  || gameState.keys['a']) { dx = -PLAYER_SPEED; gameState.player.dir = 3; }
  if (gameState.keys['ArrowRight'] || gameState.keys['d']) { dx =  PLAYER_SPEED; gameState.player.dir = 1; }
  if (gameState.keys['ArrowUp']    || gameState.keys['w']) { dy = -PLAYER_SPEED; gameState.player.dir = 0; }
  if (gameState.keys['ArrowDown']  || gameState.keys['s']) { dy =  PLAYER_SPEED; gameState.player.dir = 2; }
  if (dx || dy) gameState.walkAnim++;
  const nx = Math.max(12, Math.min(ROOM_W*TILE-12, gameState.player.x+dx));
  const ny = Math.max(12, Math.min(ROOM_H*TILE-12, gameState.player.y+dy));
  if (dx && !isBlocked(nx, gameState.player.y)) gameState.player.x = nx;
  if (dy && !isBlocked(gameState.player.x, ny)) gameState.player.y = ny;
}

function drawRoom() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f5e6c8'; ctx.fillRect(offX, offY, ROOM_W*TILE, 60);
  for (let x = 0; x < ROOM_W; x++) {
    for (let y = 2; y < ROOM_H; y++) {
      ctx.fillStyle = (x+y)%2===0 ? '#d4b87a' : '#c8a860';
      ctx.fillRect(offX+x*TILE, offY+y*TILE, TILE, TILE);
    }
  }
}

function drawFurniture() {
  for (const p of gameState.placed) {
    const itm = getItem(p.id);
    const fx = offX+p.tx*TILE, fy = offY+p.ty*TILE;
    ctx.fillStyle = itm.color; ctx.fillRect(fx, fy, itm.w*TILE, itm.h*TILE);
    ctx.font = "20px serif"; ctx.textAlign = "center"; ctx.fillText(itm.emoji, fx+itm.w*TILE/2, fy+itm.h*TILE/2+7);
  }
}

function drawPlayer() {
  const px = offX + gameState.player.x, py = offY + gameState.player.y;
  ctx.fillStyle = '#ff9eb5'; ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI*2); ctx.fill();
}

function render() {
  update(); drawRoom(); drawFurniture(); drawPlayer();
  requestAnimationFrame(render);
}

function switchTab(t) {
  gameState.tab = t;
  document.getElementById('shopTab').classList.toggle('active', t === 'shop');
  document.getElementById('invTab').classList.toggle('active', t === 'inv');
  renderGameUI();
}

function renderGameUI() {
  document.getElementById('coinDisplay').textContent = gameState.coins;
  document.getElementById('navBells').textContent = gameState.coins;
  const list = document.getElementById('itemList');
  list.innerHTML = '';

  if (gameState.tab === 'shop') {
    SHOP_ITEMS.forEach(itm => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `<div>${itm.emoji} ${itm.name}</div><div>🪙 ${itm.cost}</div>`;
      card.onclick = () => buyItem(itm.id);
      list.appendChild(card);
    });
  } else {
    Object.entries(gameState.inventory).forEach(([id, count]) => {
      if (count <= 0) return;
      const itm = getItem(id);
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `<div>${itm.emoji} ${itm.name} (x${count})</div>`;
      card.onclick = () => startPlace(id);
      list.appendChild(card);
    });
  }
}

function buyItem(id) {
  const itm = getItem(id);
  if (gameState.coins < itm.cost) return;
  gameState.coins -= itm.cost;
  gameState.inventory[id] = (gameState.inventory[id] || 0) + 1;
  SharedBells.set(gameState.coins);
  renderGameUI();
}

function startPlace(id) {
  gameState.mode = 'place'; gameState.activeItem = id;
}

function toggleGrid() { gameState.showGrid = !gameState.showGrid; }
function saveRoom() { localStorage.setItem('cozyRoom', JSON.stringify(gameState)); }
function loadRoom() { 
  const d = JSON.parse(localStorage.getItem('cozyRoom')); 
  if(d) { Object.assign(gameState, d); SharedBells.set(gameState.coins); renderGameUI(); } 
}

window.addEventListener('load', () => {
  canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
  gameDiv = document.getElementById('gameArea');
  resize(); window.addEventListener('resize', resize);
  render();
});

window.addEventListener('keydown', e => { gameState.keys[e.key] = true; });
window.addEventListener('keyup', e => { gameState.keys[e.key] = false; });

canvas.addEventListener('click', e => {
  if (gameState.mode === 'place' && gameState.activeItem) {
    const rect = canvas.getBoundingClientRect();
    const { tx, ty } = tileFromMouse(e.clientX - rect.left, e.clientY - rect.top);
    const itm = getItem(gameState.activeItem);
    if (canPlace(tx, ty, itm, -1)) {
      gameState.placed.push({ id: gameState.activeItem, tx, ty });
      gameState.inventory[gameState.activeItem]--;
      gameState.mode = 'move';
      renderGameUI();
    }
  }
});
</script>
</body>
</html>
